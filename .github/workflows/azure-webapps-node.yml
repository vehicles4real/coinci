# This workflow builds and deploys a Node.js app to Azure Web Apps when a commit is pushed to the default branch.
# It's been hardened to:
# - Use Node 18.x
# - Detect package.json and only run npm/yarn steps when present
# - Avoid relying on an npm cache when a lockfile is missing
# - Allow deploying a package in a subfolder via AZURE_WEBAPP_PACKAGE_PATH
# - Deploy only on a monthly schedule or manual dispatch; build still runs on push for CI feedback

name: Azure Webapps Node CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Monthly on the 1st at 00:00 UTC

env:
  AZURE_WEBAPP_NAME: your-app-name    # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '18.x'                # upgraded to current LTS

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Check for package.json and lockfile
      id: pkg_check
      run: |
        PKG_PATH="${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
        if [ -f "$PKG_PATH/package.json" ]; then
          echo "present=true" >> $GITHUB_OUTPUT
        else
          echo "present=false" >> $GITHUB_OUTPUT
        fi
        if [ -f "$PKG_PATH/package-lock.json" ] || [ -f "$PKG_PATH/npm-shrinkwrap.json" ] || [ -f "$PKG_PATH/yarn.lock" ]; then
          echo "has_lock=true" >> $GITHUB_OUTPUT
        else
          echo "has_lock=false" >> $GITHUB_OUTPUT
        fi

    - name: Install dependencies
      if: steps.pkg_check.outputs.present == 'true'
      run: |
        cd "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
        if [ "${{ steps.pkg_check.outputs.has_lock }}" = "true" ]; then
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            yarn install
          else
            npm install
          fi
        else
          npm install
        fi

    - name: npm install, build, and test
      if: steps.pkg_check.outputs.present == 'true'
      run: |
        cd "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
        npm run build --if-present
        npm run test --if-present

    - name: Upload artifact for deployment job
      if: steps.pkg_check.outputs.present == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    # Only run deploy when workflow is triggered by a schedule (monthly) or manual dispatch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    environment:
      name: 'Production'   # set to Production so you can require approvals in Settings → Environments
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v3
      with:
        name: node-app

    - name: 'Deploy to Azure WebApp'
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
